---
# плейсхолдеры меню {menu_id}, {has_back_menu}, {clicked_slot}

extends:
  - ./file.yml # путь относительно текущей папки
  - ../file.yml # путь относительно папки на уровень выше
  - /file.yml  # путь относительно корневой папки с меню

include: [
  "./file.yml",
  "../file.yml",
  "/file.yml",
]

click_cooldown: 100
id: <namespace>:<id> # разрешены символы [a-z0-9._-]
provider: <namespace>:<id> # по умолчанию bmenu:default
type: chest
size: 27
title: # или строка: title: '&7Menu title'
  ru_RU: '&7Заголовок меню'
  en_US: '&7Menu title'
# Fallback: Themes.defaultLocale, затем первый перевод. Обычные name/lore задают свой fallback.
args:
  VALUE: '42'

---
clicks:
  on_click:
    - message: '&aСообщение' # также: '[message] &aСообщение' или просто '&aСообщение'
    - if: '100 == 100' # условие
      do: # условие верно
        - message: 'Условие выполнено'
      else: # условие ложно
        - message: 'Условие не выполнено'
    - if: '%vault_eco_balance% > 1000'
      do:
        console: 'eco take %player_name% 1000'
    - if: '99 == 99'
      do:
        if: '88 == 88' # можно указывать if внутри других if
        do: 'Вложенный if'
  on_left_click:
    - oneOf: # oneOf команды, это команды которые останавливаются на первом успешном if
        - if: '%vault_eco_balance% < 1000'
          do: 'У Вас не достаточно монет!'
        - if: '%player_name% == _By1337_'
          do: 'Привет, _By1337_!'
        - do: # просто do без условия
            - 'Баланс не меньше 1000 монет'
  on_view: # результат условия определяет видимость
    - if: '%vault_eco_balance% > 1000'
      else: 'Ты слишком бедный, чтобы видеть этот предмет('
  on_right_click:
    - if-all: # можно объединить несколько условий
        - '%vault_eco_balance% > 1000'
        - '%player_name% == _By1337_'
      do: 'Все условия верны'
    - if-one:
        - '%vault_eco_balance% > 1000'
        - '100 < -1'
      do: 'Как минимум одно условие верно!'
  on_middle_click:
    - all_players: # команды для каждого игрока
        message: '&7Привет, %player_name%!'
    - nearby-10: # игроки в радиусе 10 блоков
        action_bar: '&eРядом с вами открыли меню'
    - weights: # один случайный вариант с указанным весом
        '1': {message: 'Редкий вариант'}
        '3': {message: 'Частый вариант'}
# Старые commands/deny_commands/requirements и [break] поддерживаются для совместимости.
---

# [run] <имя набора>
# Или выполнять рандомно
# [run_rand]
commands-list:
  example-1:
    weight: 1.0 # вес для run_rand, по умолчанию 1
    commands: # примеры команд в clicks
      - '&7Это команда из example-1'
  example-2:
    weight: 1.0
    commands: # примеры команд в clicks
      - '&7Это команда из example-2'

# Меню ивенты
menu-events:
  on_open: # примеры команд в clicks
    - 'Меню открыто!'
  on_reopen: # примеры команд в clicks
    - 'Меню открыто заново!'
  on_close: # примеры команд в clicks
    - 'Меню закрыто!'


items:
  itemID:
    # также все параметры из https://github.com/By1337/ConfigurableItems/blob/master/src/main/resources/cfg_items/reference.yml
    # Без slot предмет доступен для установки командами; также slot: 10 или [10, '12-20'].
    slot: '10-15,20-25'
    material: paper
    name-ru_RU: '&aПредмет'
    name-en_US: '&aItem'
    lore-ru_RU:
      - '&7Значение: {VALUE}'
    lore-en_US:
      - '&7Value: {VALUE}'
    # Обычные name/lore необязательны. Без них fallback берётся по Themes.defaultLocale.
    amount: 1 # или плейсхолдер
    oneOf: # выбирает один из вариантов ниже, проверяет условия сверху вниз.
      - material: diamond
        # здесь нельзя указывать local_args, priority, slot, on_tick, tick_speed, oneOf
        on_view: '100 == 100'
      - material: gold_block

    # Константы предмета: {PARAM_1}.
    args:
      PARAM_1: 'value'
      PARAM_2: 'value'
      PARAM_3: 'value'
    local_args: # как args но только эти параметры можно менять через '[set_local] <name> <value>'.
      lParam_1: 'value'
      lParam_2: 'value'
      lParam_3: 'value'
    # on_view: '100 > 10' или список условий (все должны быть верны).
    on_view:
      if: 'has menu.example'
      else:
        message: '&cНет доступа'
    on_left_click: # обработка клика
      - if: '100 == 100'
        do:
          - message: '&aНажато'
    tick_speed: 20 # интервал on_tick в тиках
    on_tick:
      - if: '{tick} % 3 == 0'
        do: '[message] tick!'
        else: '[update]'

---
# Все команды
# Аргумент в начале которого ? не обязательный.
# Формы: message: 'текст', '[message] текст' или просто 'текст'.
# Без аргументов: close: '' или '[close]'.
commands:
  ### Сообщения и вывод
  - '&7Просто сообщение'
  - message: '&7Сообщение' # aliases: messages
  - message: # карты локалей также работают у broadcast/bc/message_all, action_bar(_all), title(_all)
      ru_RU: '&aПривет, %player_name%!'
      en_US: '&aHello, %player_name%!'
  # Локаль получателя → совпадающий язык → Themes.defaultLocale; без перевода вывод пропускается.
  - message: |-
      &aПервая строка
      &7Вторая строка
  - action_bar: '&eСообщение над хотбаром'
  - action_bar_all: '&eВсем игрокам'
  - broadcast: '&aСообщение всем' # aliases: bc, message_all
  - title: '"Title\nSubtitle" 10 70 20' # старый формат; тайминги необязательны
  - title:
      ru_RU: |-
        &dПривет, игрок!
        &7Имя: %player_name%
        10
        70
        20
      en_US: |-
        &dHello, player!
        &7Name: %player_name%
        10 70 20
  # Первые две строки — title/subtitle, затем fadeIn stay fadeOut в тиках (можно плейсхолдеры).
  # Без таймингов: 10 70 20. title_all поддерживает те же формы для всех игроков.
  - title_all: '"Title\nSubtitle" 10 70 20'
  - set_title: '&7Заголовок окна меню' # переопределяет title из конфига
  - sound: '<sound> <?volume> <?pitch>'
  ### Выполнение команд
  - console: 'op %player_name%' # выполнить команду от имени сервера
  - player: 'msg _By1337_ привет?' # выполнить команду от имени игрока
  - chat: '/rtp' # Отправит сообщение от имени игрока, если в начале будет / то будет как команда
  ### Навигация по меню
  # В commands вы можете передать список команд которые необходимо выполнить в открывающейся менюшке
  # Синтаксис [open] menu ["[message] сообщение из открытого меню", "[что-то] некст команда"]
  - open: '<menu:id> <?commands>'
  - open: # параметры передаются в args открываемого меню
      menu: example:shop
      VALUE: '42'
  - back: {VALUE: '42'} # параметры предыдущего меню
  - back_or_open: {menu: 'example:shop', VALUE: '42'}
  - reopen: '' # повторно открыть текущее меню
  - close: '' # закроет меню
  - back: '<?commands>' # вернутся в прошлое меню
  - back_or_close: '<?commands>' # вернутся в прошлое меню если есть
  - back_to_or_close: '<menu:id> <?commands>' # вернутся в <menu:id> если было открыто ранее
  - back_or_open: '<menu:id> <?commands>' # вернутся в <menu:id> если было открыто иначе открыть <menu:id>
  ### Экономика и сервер
  - connect: '<server>' # подключает игрока к серверу
  - givemoney: '<count>' # выдать монеты
  - takemoney: '<count>' # снять монеты
  ### Управление предметами
  - refresh: '' # обновить содержимое меню
  - rebuild: '' # пересобрать текущий предмет
  - rebuild_slots: '<slots>' # пересобрать предметы в слотах
  - set_item_to_layer: '<slots> <layer> <item>' # item: ID предмета, материал или -me
  # <slots> - указывается как '10' или '0-10' или '0-10,30-40,50'
  - update: '' # обновляет предмет выполнивший эту команду
  - update_slots: '<slots>' # обновляет предметы в слотах
  - die: '' # удаляет предмет выполнивший эту команду
  - die_slots: '<slots>' # удаляет предметы в слотах
  - layer: '<layer> set <item> <slots>'
  - layer: '<layer> remove <slots>'
  - layer: '<layer> move <layer2> <from> <to>'
  - layer: '<layer> copy <layer2> <from> <to>'
  - layer: '<layer> clear'
  - simulate: 'click slot' # симулирует клик по предмету в слоте
  ### Анимации
  - set_animation: '<animation>' # устанавливает анимацию из animations
  - animation_tick: '' # принудительно вызывает тик анимации
  - animation_force_end: '' # моментально завершает анимацию
  ### Параметры меню
  - set_param: '<arg> <value>' # меняет значения в args
  - import_params: '<item>' # копирует args из предмета в args меню
  ### Параметры предмета
  - set_local: <name> <value> # меняет параметры предмета из local_args
  ### Выполнение команд меню
  - run: '<id>' # выполняет список команд из commands-list
  - run_rand: '' # выполняет случайных список команд из commands-list
  - delay: '<delay> <cmd>' # выполнить команду с задержкой например [delay] 20 [message] &aЭто сообщение отправилось спустя 1 секунду!
  ### Ввод в чат
  - input_chat: # число или математическое выражение → args.VALUE
      param: VALUE
      on_pass: {message: 'Введено: {VALUE}'}
      on_failed: {message: '&cНекорректный ввод'}
  - input_chat_str: # строка → args.TEXT
      param: TEXT
      on_pass: {message: 'Введено: {TEXT}'}
      on_failed: {message: '&cВвод отменён'}
  ### Контекст
  - up: ''
  - down: ''
  - import_from_down: ''

