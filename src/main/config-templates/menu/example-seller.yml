extends:
  - './animation-54.yml'

id: example:seller
provider: default
type: chest
size: 54
title: '&7Селлер' # @locale:ru
title: '&7Shop' # @locale:en

on_left_click: &buy-ful
  - if: '%vault_eco_balance_fixed% >= {PRICE}'
    do:
      - takemoney: '{PRICE}'
      - console: 'give %player_name% {MATERIAL} {AMOUNT}'
      - '&aВы успешно купили {NAME}&a в количестве {AMOUNT}' # @locale:ru
      - '&aYou bought {AMOUNT} x {NAME}' # @locale:en
      - update_slots: '10-43'
    else: &no_money
      - '&cУ Вас не достаточно баланса!' # @locale:ru
      - '&cYou do not have enough money!' # @locale:en
      - layer: '2 set not_enough_money {clicked_slot}'
      - update_slots: '10-43'

on_right_click: &buy-32
  - if: '%vault_eco_balance_fixed% >= {PRICE_32}'
    do:
      - takemoney: '{PRICE_32}'
      - console: 'give %player_name% {MATERIAL} {AMOUNT_32}'
      - '&aВы успешно купили {NAME}&a в количестве {AMOUNT_32}' # @locale:ru
      - '&aYou bought {AMOUNT_32} x {NAME}' # @locale:en
      - update_slots: '10-43'
    else: *no_money

items-default:
  buyer-item2: &item
    material: '{MATERIAL}'
    # все предметы внутри oneOf унаследуют параметр material, список всех параметров которые наследуются здесь https://github.com/By1337/ConfigurableItems/blob/master/src/main/resources/cfg_items/reference.yml # @locale:ru
    # all items inside oneOf inherit material; see the full list of inherited settings here https://github.com/By1337/ConfigurableItems/blob/master/src/main/resources/cfg_items/reference.yml # @locale:en
    oneOf:
      - amount: '{AMOUNT}'
        name: '&7{NAME} x{AMOUNT}'
        lore:
          - '&r '
          - '&r &7Нажмите лкм' # @locale:ru
          - '&r &7Left-click' # @locale:en
          - '&r &7чтобы купить {NAME}&7 в количестве {AMOUNT} за {PRICE} монет' # @locale:ru
          - '&r &7to buy {AMOUNT} x {NAME}&7 for {PRICE} coins' # @locale:en
          - '&r &7Нажмите пкм' # @locale:ru
          - '&r &7Right-click' # @locale:en
          - '&r &7чтобы купить {NAME}&7 в количестве {AMOUNT_32} за {PRICE_32} монет' # @locale:ru
          - '&r &7to buy {AMOUNT_32} x {NAME}&7 for {PRICE_32} coins' # @locale:en
          - '&r '
        on_view: '%vault_eco_balance_fixed% >= {PRICE}'
        on_left_click: *buy-ful
        on_right_click: *buy-32

      - amount: '{AMOUNT_32}'
        name: '&7{NAME} x{AMOUNT_32}'
        lore:
          - '&r '
          - '&r &7Нажмите' # @locale:ru
          - '&r &7Click' # @locale:en
          - '&r &7чтобы купить {NAME}&7 в количестве {AMOUNT_32} за {PRICE_32} монет' # @locale:ru
          - '&r &7to buy {AMOUNT_32} x {NAME}&7 for {PRICE_32} coins' # @locale:en
          - '&r '
        on_view: '%vault_eco_balance_fixed% >= {PRICE_32}'
        on_click: *buy-32

      - amount: 1
        name: '&7{NAME}'
        lore:
          - '&r '
          - '&r &cУ Вас не достаточно баланса!' # @locale:ru
          - '&r &cYou do not have enough money!' # @locale:en
          - '&r &7Цена за 32 {PRICE_32}' # @locale:ru
          - '&r &7Price for 32: {PRICE_32}' # @locale:en
          - '&r &7Цена за 64 {PRICE}' # @locale:ru
          - '&r &7Price for 64: {PRICE}' # @locale:en
          - '&r '
        on_click: *no_money

items:
  not_enough_money:
    material: barrier
    name: "&cУ Вас не достаточно баланса!" # @locale:ru
    name: "&cYou do not have enough money!" # @locale:en
