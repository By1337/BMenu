name: Java CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: target/*.jar
          if-no-files-found: error